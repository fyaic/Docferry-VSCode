name: Visual Studio Marketplace Package Gate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Checksummed GitHub release to verify before manual Marketplace upload
        required: true
        default: v0.2.7
        type: string

permissions:
  contents: read

concurrency:
  group: visual-studio-marketplace
  cancel-in-progress: false

jobs:
  marketplace:
    name: Verify ${{ inputs.release_tag }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm

      - name: Check release source
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || { echo "Marketplace operations must run from main." >&2; exit 1; }

      - name: Download accepted release packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p marketplace-assets
          gh release download "${{ inputs.release_tag }}" \
            --repo "${{ github.repository }}" \
            --dir marketplace-assets \
            --pattern '*.vsix' \
            --pattern SHA256SUMS
          gh release view "${{ inputs.release_tag }}" \
            --repo "${{ github.repository }}" \
            --json tagName,targetCommitish,isPrerelease,url,assets \
            > marketplace-assets/github-release.json

      - name: Verify release identity, platforms, and checksums
        run: python3 scripts/verify_marketplace_release.py marketplace-assets --tag "${{ inputs.release_tag }}" | tee marketplace-assets/verification.json

      - name: Summarize manual upload boundary
        run: |
          echo "### Marketplace package gate" >> "$GITHUB_STEP_SUMMARY"
          echo "Release \`${{ inputs.release_tag }}\` passed source, target, manifest, and checksum verification." >> "$GITHUB_STEP_SUMMARY"
          echo "Upload these exact assets through the authenticated Bondie publisher page, following \`docs/PUBLISHING.md\`." >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow intentionally has no Marketplace credential or upload permission." >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve low-sensitivity publication evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: marketplace-package-gate-${{ inputs.release_tag }}
          path: |
            marketplace-assets/github-release.json
            marketplace-assets/verification.json
          if-no-files-found: ignore
          retention-days: 30
