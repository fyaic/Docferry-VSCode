name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    if: github.repository == 'fyaic/Docferry-VSCode'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: windows-2025
            target: win32-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify tag matches extension version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docferry-vscode-${{ matrix.target }}
          path: dist/docferry-vscode-*.vsix
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: docferry-vscode-*
          path: release-assets
          merge-multiple: true
      - name: Write checksums
        run: find release-assets -name '*.vsix' -type f -print0 | sort -z | xargs -0 sha256sum | sed 's#release-assets/##' > SHA256SUMS
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/*.vsix SHA256SUMS --verify-tag --prerelease --generate-notes
